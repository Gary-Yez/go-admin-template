# 修改数据库等配置后，请重新启动程序。
server:
  node_name: "" # 节点显示名称，留空使用主机名；实例 ID 每次启动自动生成
  dev: false # 开发环境需要代码生成工具时改为 true
  host: "0.0.0.0"
  port: "8080"
  admin_prefix: "/admin"
  api_prefix: "/api"
jwt:
  secret: "" # 必须填写至少 32 字节的随机密钥；多实例使用相同密钥
database:
  driver: "mysql" # mysql / postgres
  host: "127.0.0.1"
  port: "3306"
  username: ""
  password: ""
  name: ""
  sslmode: "disable" # PostgreSQL TLS 模式；MySQL 忽略
  max_idle_conns: 10 # 最大空闲连接数；0 表示不保留空闲连接
  max_open_conns: 50 # 每个实例的最大总连接数；0 表示不限制
  conn_max_lifetime: "1h" # 连接最长复用时间；0s 表示不限制
redis:
  host: "" # 留空时使用内存缓存
  port: "6379"
  username: ""
  password: ""
  db: 0
